        color: #fff;

        box-shadow: 0 0 22px rgba(34, 217, 255, 0.45);
        transform: translateY(-2px);

    .ejemplos button i { font-size: 0.95rem; filter: drop-shadow(0 0 6px rgba(34, 217, 255, 0.5)); }
    @media (max-width: 900px) {
        .tutor-layout { flex-direction: column; }
        .tutor-side { display: none; width: 100%; position: static; max-height: 300px; }
        .tutor-side.open { display: flex; }

<main class="main">

        <aside class="tutor-side" id="tutorSide">
            <button class="btn sm" style="justify-content:center;" onclick="nuevoChat()"><i class="fas fa-pen"></i> Nuevo chat</button>
            <button class="btn sm ghost btn-historial" style="justify-content:center;" onclick="document.getElementById('tutorSide').classList.toggle('open')"><i class="fas fa-clock-rotate-left"></i> Ver historial</button>

        <section style="flex:1;min-width:0;">
            <section class="hero" style="padding:22px 26px;margin-bottom:14px;">

                    <button class="chip" onclick="prefijar('Tengo una duda: ')">Tengo una duda</button>
                    <button class="chip" onclick="prefijar('Explícame este tema: ')">Explícame un tema</button>
                    <button class="chip" onclick="prefijar('Hazme un resumen de: ')">Resumen</button>
                    <button class="chip" onclick="prefijar('Dame las fórmulas clave de: ')">Fórmulas</button>
                    <button class="chip" onclick="prefijar('Genera un cuadro comparativo de: ')">Cuadro</button>
                    <button class="chip" onclick="prefijar('Bótame libros de: ')">Libros completos</button>
                </div>
                <div class="chat-input">
                    <input id="chatInput" placeholder="Ej.: dame las fórmulas de MRUV, genera un cuadro, código de ejemplo...">

            </div>

    </div>
    <footer class="footer">Devioz Academy © 2025</footer>

<script>
const BASE = '/lms_prepa/backend/controllers/';
let cursos = [];
let convActual = null;
let convsData = [];
let webOn = true;
let respuestasRaw = [];
let ocupado = false;
window.historialLocal = [];

document.addEventListener('DOMContentLoaded', async function() {
    cargarSesion();
    document.getElementById('out').onclick = function() {
        if (confirm('¿Cerrar sesión?')) { localStorage.clear(); sessionStorage.clear(); window.location.href = 'index.html'; }
    };
    document.getElementById('chatInput').addEventListener('keypress', e => { if (e.key === 'Enter') enviar(); });
    document.getElementById('webToggle').onclick = function(){
        webOn = !webOn;
        this.classList.toggle('on-web', webOn);
        this.innerHTML = '<i class="fas fa-globe"></i> Internet: ' + (webOn ? 'ON' : 'OFF');
    };
    await cargarCursos();
    await cargarConversaciones();
    saludoInicial();
    const params = new URLSearchParams(window.location.search);
    if (params.get('curso')) { document.getElementById('selCurso').value = params.get('curso'); actualizarHead(); }
    if (params.get('q')) { document.getElementById('chatInput').value = params.get('q'); enviar(); }
});

async function cargarSesion() {
    try {
        const res = await fetch(BASE + 'UsuarioController.php?accion=mi_perfil');
        const d = await res.json();
        if (d.ok && d.data) {
            localStorage.setItem('usuario', JSON.stringify(d.data));
            document.getElementById('navNombre').textContent = d.data.nombre;
            document.getElementById('navAvatar').innerHTML = d.data.foto ? '<img src="' + d.data.foto + '" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">' : d.data.nombre.charAt(0).toUpperCase();
            if (d.data.rol && d.data.rol !== 'estudiante') window.location.href = 'dashboard_admin.html';
        }
    } catch (e) { console.error(e); }
}
async function cargarCursos() {
    try {
        const res = await fetch(BASE + 'CursoController.php?accion=listar');
        const data = await res.json();
        cursos = data.data || [];
        const sel = document.getElementById('selCurso');
        cursos.forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.nombre; sel.appendChild(o); });
    } catch (e) { console.error(e); }
}
function actualizarHead() {
    const sel = document.getElementById('selCurso');
    const c = cursos.find(x => x.id == sel.value);
    document.getElementById('headCurso').textContent = c ? '· ' + c.nombre : '';
}

/* ========== RENDERIZADO MARKDOWN + LATEX ========== */
function renderMD(txt){
    const blocks = [];
    txt = txt.replace(/\$\$([\s\S]+?)\$\$/g, m => { blocks.push(m); return '@@MATH' + (blocks.length - 1) + '@@'; });
    txt = txt.replace(/\$([^\n$]+?)\$/g, m => { blocks.push(m); return '@@MATH' + (blocks.length - 1) + '@@'; });
    let html = marked.parse(txt);
    html = html.replace(/@@MATH(\d+)@@/g, (m, i) => blocks[+i]);
    html = DOMPurify.sanitize(html);
    return html;
}
function matematicas(el){
    if (typeof renderMathInElement !== 'undefined') {
        renderMathInElement(el, {
            delimiters: [
                { left: '$$', right: '$$', display: true },
                { left: '$',  right: '$',  display: false },
                { left: '\\[', right: '\\]', display: true },
                { left: '\\(', right: '\\)', display: false }
            ],
            throwOnError: false
        });
    }
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ========== 🔍 BÚSQUEDA WEB CON GOOGLE ========== */
async function contextoWeb(q){
    try {
        const fd = new FormData();
        fd.append('accion', 'buscar_web');
        fd.append('query', q);
        fd.append('num', '3');
        const r = await fetch(BASE + 'IAController.php', { method: 'POST', body: fd });
        const d = await r.json();
        if (!d.ok || !d.data || !d.data.length) return '';
        return d.data.map(s => '- ' + s.title + ': ' + s.snippet + ' (fuente: ' + s.link + ')').join('\n');
    } catch (e) { 
        console.error('Error búsqueda web:', e);
        return ''; 
    }
}

/* ========== MENSAJES ========== */
function saludoInicial() {
    const u = JSON.parse(localStorage.getItem('usuario') || '{}');
    const nombre = u.nombre ? u.nombre.split(' ')[0] : '';

    document.getElementById('chatBody').innerHTML = '';
    respuestasRaw = [];
    window.historialLocal = [];

    const div = document.createElement('div');
    div.className = 'msg ia saludo';
    div.innerHTML = `
        <div class="md">
            <p>¡Hola${nombre ? ', <strong>' + escapeHtml(nombre) + '</strong>' : ''}! 👋 Soy tu <strong>Tutor Devioz</strong>, tu compañero de estudio para <strong>cualquier curso</strong>.</p>
            <p>Puedo ayudarte con:</p>
            <ul>
                <li>📚 <strong>Explicaciones</strong> paso a paso de cualquier tema</li>
                <li>🧮 <strong>Fórmulas y ejercicios</strong> resueltos (mate, física, química…)</li>
                <li>📊 <strong>Resúmenes, cuadros y tablas</strong> comparativas</li>
                <li>💻 <strong>Código</strong> y ejemplos prácticos</li>
                <li>🌐 <strong>Información actualizada</strong> de internet</li>
                <li>📖 <strong>Libros y PDFs</strong> completos para descargar</li>
            </ul>
            <p>Escribe tu pregunta abajo, o toca un ejemplo para probarme 👇</p>
        </div>
        <div class="ejemplos">
            <button onclick="prefijarYEnviar('Explícame qué es la célula y sus partes')">🔬 Biología</button>
            <button onclick="prefijarYEnviar('Resuelve esta ecuación: 2x + 6 = 14')">🧮 Matemática</button>
            <button onclick="prefijarYEnviar('Hazme un resumen de la Independencia del Perú')">📜 Historia</button>
            <button onclick="prefijarYEnviar('Dame las fórmulas clave del MRUV')">📐 Física</button>
            <button onclick="prefijarYEnviar('Dame un ejemplo de código en Python')">💻 Código</button>
            <button onclick="prefijarYEnviar('¿Cuál es el tipo de cambio del dólar hoy?')">🌐 Actualidad</button>
        </div>`;
    document.getElementById('chatBody').appendChild(div);
    document.getElementById('chatBody').scrollTop = 99999;
}

function addMsg(texto, tipo, usoWeb = false) {
    const div = document.createElement('div');
    div.className = 'msg ' + tipo;
    if (tipo === 'ia') {
        const idx = respuestasRaw.push(texto) - 1;
        div.innerHTML = '<div class="md">' + renderMD(texto) + '</div>' +
            (usoWeb ? '<span class="web-badge"><i class="fas fa-globe"></i> con internet</span>' : '') +
            '<div class="msg-tools">' +
                '<button onclick="copiarResp(' + idx + ')"><i class="fas fa-copy"></i> Copiar</button>' +
                '<button onclick="imprimirResp(' + idx + ')"><i class="fas fa-file-pdf"></i> PDF</button>' +
                '<button onclick="exportWord(' + idx + ')"><i class="fas fa-file-word"></i> Word</button>' +
                '<button onclick="exportExcel(' + idx + ')"><i class="fas fa-file-excel"></i> Excel</button>' +
            '</div>';
        document.getElementById('chatBody').appendChild(div);
        matematicas(div);
    } else {
        div.textContent = texto;
        document.getElementById('chatBody').appendChild(div);
    }
    document.getElementById('chatBody').scrollTop = 99999;
    return div;
}

function prefijar(txt) { const i = document.getElementById('chatInput'); i.value = txt; i.focus(); }

function prefijarYEnviar(txt) {
    document.getElementById('chatInput').value = txt;
    enviar();
}

/* ========== EXPORTACIÓN ========== */
function descargar(blob, nombre){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
}
function copiarResp(i){
    navigator.clipboard.writeText(respuestasRaw[i]).then(()=>alert('📋 Copiado'));
}
function imprimirResp(i){
    const w = window.open('', '_blank', 'width=900,height=700');
    w.document.write('<!DOCTYPE html><html><head><title>Devioz | Respuesta</title>' +
        '<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">' +
        '<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"><\/script>' +
        '<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"><\/script>' +
        '<style>body{font-family:Segoe UI,Arial,sans-serif;margin:40px;color:#111;line-height:1.6}' +
        'table{border-collapse:collapse}td,th{border:1px solid #999;padding:6px 10px}' +
        'pre{background:#f4f4f4;padding:10px;border-radius:8px}' +
        'h1,h2,h3{color:#4338ca}</style></head><body>' +
        '<h2>🧠 Tutor Devioz Academy</h2><div id="c">' + renderMD(respuestasRaw[i]) + '</div>' +
        '<script>onload=function(){renderMathInElement(document.getElementById("c"),{delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}]});setTimeout(function(){window.print()},400)}<\/script>' +
        '</body></html>');
    w.document.close();
}
function exportWord(i){
    const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">' +
        '<head><meta charset="utf-8"><title>Devioz Tutor</title></head><body>' +
        '<h1>Tutor Devioz Academy</h1>' + renderMD(respuestasRaw[i]) + '</body></html>';
    descargar(new Blob(['\ufeff', html], {type:'application/msword'}), 'tutor-devioz.doc');
}
function exportExcel(i){
    const lineas = respuestasRaw[i].split('\n');
    let filas = '';
    lineas.forEach(l=>{
        l = l.trim();
        if(!l) return;
        if(l.includes('|')){
            const celdas = l.split('|').map(c=>c.trim()).filter(c=>c!=='');
            if(celdas.length && celdas.every(c=>/^:?-+:?$/.test(c))) return;
            if(celdas.length) filas += '<tr>' + celdas.map(c=>'<td>'+escapeHtml(c)+'</td>').join('') + '</tr>';
        } else {
            filas += '<tr><td>'+escapeHtml(l)+'</td></tr>';
        }
    });
    const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head>' +
        '<body><table border="1">'+filas+'</table></body></html>';
    descargar(new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel'}), 'tutor-devioz.xls');
}

/* ========== ENVÍO ========== */
async function enviar() {
    const input = document.getElementById('chatInput');
    const texto = input.value.trim();
    if (!texto || ocupado) return;
    ocupado = true;
    addMsg(texto, 'user');
    input.value = '';
    const btn = document.getElementById('btnSend');
    btn.disabled = true;
    const typing = addMsg('<i class="fas fa-spinner fa-spin"></i> Pensando...', 'ia');

    const sel = document.getElementById('selCurso');
    const curso = cursos.find(x => x.id == sel.value);
    const nombreCurso = curso ? curso.nombre : '';
    const esLibros = /\b(libro|libros|pdf|pdfs|bibliografia|bibliografía|material|guia|guía|apuntes|manual|manuales|b[oó]tame|v[oó]tame)\b/i.test(texto);

    let respuesta = '';
    let usoWeb = false;
    try {
        let ctxWeb = '';
        if (webOn) { 
            ctxWeb = await contextoWeb(texto); 
            if (ctxWeb) usoWeb = true; 
        }

        const fd = new FormData();
        fd.append('accion', 'chatLibre');
        fd.append('mensaje', texto);
        fd.append('curso', nombreCurso);
        fd.append('web', webOn ? '1' : '0');
        fd.append('contexto_web', ctxWeb);
        fd.append('historial', JSON.stringify(window.historialLocal.slice(-6)));
        fd.append('modulo', 'cursos');

        let data = null;
        if (esLibros) {
            try {
                const fdL = new FormData();
                fdL.append('accion', 'buscar');
                fdL.append('q', (nombreCurso ? nombreCurso + ': ' : '') + texto);
                const rL = await fetch(BASE + 'LibrosController.php', { method: 'POST', body: fdL });
                const dL = await rL.json();
                if (dL.ok && dL.data && dL.data.respuesta) data = { ok: true, respuesta: dL.data.respuesta };
            } catch (e) {}
        }
        if (!data) {
            const r = await fetch(BASE + 'IAController.php', { method: 'POST', body: fd });
            data = await r.json();
        }

        if (data.ok && data.respuesta) respuesta = data.respuesta;
        else throw new Error(data.msg || 'sin respuesta');

        window.historialLocal.push({ rol: 'user', texto }, { rol: 'ia', texto: respuesta });
    } catch (e) {
        respuesta = 'No pude conectar con el tutor ahora mismo. Intenta de nuevo en unos minutos. 📚';
    } finally {
        typing.remove();
        btn.disabled = false;
        ocupado = false;
        addMsg(respuesta, 'ia', usoWeb);
        await cargarConversaciones();
        if (convsData.length) convActual = convsData[0].id;
    }
}

/* ========== HISTORIAL ========== */
async function cargarConversaciones() {
    try {
        const res = await fetch(BASE + 'TutorController.php?accion=listar_conversaciones');
        const data = await res.json();
        convsData = data.data || [];
        const box = document.getElementById('listaConvs');
        if (!convsData.length) { box.innerHTML = '<div class="side-empty">Aún no tienes conversaciones.</div>'; return; }
        box.innerHTML = convsData.map(c => `
            <div class="conv-item ${convActual == c.id ? 'on' : ''}" onclick="abrirConversacion(${c.id})">
                <i class="fas fa-comments" style="color:var(--cyan);font-size:0.85rem;"></i>
                <span class="ct">${escapeHtml(c.titulo)}</span>
                <button class="cx" title="Eliminar" onclick="event.stopPropagation(); eliminarConv(${c.id})"><i class="fas fa-trash"></i></button>
            </div>`).join('');
    } catch (e) { console.error(e); }
}

async function abrirConversacion(id) {
    try {
        const res = await fetch(BASE + 'TutorController.php?accion=obtener_mensajes&id=' + id);
        const data = await res.json();
        if (!data.ok) { alert(data.msg); return; }
        convActual = id;
        document.getElementById('chatBody').innerHTML = '';
        respuestasRaw = [];
        window.historialLocal = [];
        addMsg('<strong style="color:var(--cyan);">Repasando:</strong> ' + escapeHtml(data.data.titulo), 'ia');
        data.data.mensajes.forEach(m => {
            addMsg(m.mensaje, m.rol === 'user' ? 'user' : 'ia');
            window.historialLocal.push({ rol: m.rol, texto: m.mensaje });
        });
        cargarConversaciones();
        if (window.innerWidth <= 900) document.getElementById('tutorSide').classList.remove('open');
    } catch (e) { alert('Error al abrir la conversación.'); }
}

function nuevoChat() {
    convActual = null;
    saludoInicial();
    cargarConversaciones();
    if (window.innerWidth <= 900) document.getElementById('tutorSide').classList.remove('open');
}

async function eliminarConv(id) {
    if (!confirm('¿Eliminar esta conversación del historial?')) return;
    try {
        const fd = new FormData();
        fd.append('accion', 'eliminar_conversacion');
        fd.append('id', id);
        const res = await fetch(BASE + 'TutorController.php', { method: 'POST', body: fd });
        const data = await res.json();
        if (data.ok) { if (convActual == id) nuevoChat(); cargarConversaciones(); }
        else alert(data.msg);
    } catch (e) { alert('Error al eliminar.'); }
}
</script>
